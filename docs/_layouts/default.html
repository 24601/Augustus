<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </head>
  <body class="page{% if page.page_class %} page-{{ page.page_class }}{% endif %}">
    <div class="mesh" aria-hidden="true"></div>
    <a class="skip" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="{{ '/' | relative_url }}">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="3.2" rx="1" />
            <rect x="3" y="10.4" width="12.5" height="3.2" rx="1" opacity="0.55" />
            <rect x="3" y="16.8" width="15.2" height="3.2" rx="1" opacity="0.28" />
          </svg>
          <span>Augustus</span>
        </a>
        <ul class="nav-links">
          <li>
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          </li>
          <li>
            <a href="{{ '/ecosystem.html' | relative_url }}"{% if page.url contains 'ecosystem' %} aria-current="page"{% endif %}>Ecosystem</a>
          </li>
          <li>
            <a href="{{ '/release-notes-v0.5.0.html' | relative_url }}"{% if page.url contains 'release-notes' %} aria-current="page"{% endif %}>v0.5.0</a>
          </li>
          <li>
            <a href="https://github.com/24601/Augustus" rel="noopener noreferrer">GitHub</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main" class="site-main">
      {% if page.page_class == 'home' %}
      {{ content }}
      {% else %}
      <article class="panel prose">
        {{ content }}
      </article>
      {% endif %}
    </main>

    <footer class="site-footer">
      <div class="footer-row">
        <p>
          Named for Augustus De Morgan (1806-1871). MIT
          <a href="https://github.com/24601/Augustus/blob/main/LICENSE">LICENSE</a>.
        </p>
        <p class="footer-links">
          <a href="https://github.com/24601/Augustus">README</a>
          <a href="https://github.com/typesafe-ai/skills">typesafe-ai skill</a>
          <a href="https://github.com/24601/rh-guard">rh-guard</a>
        </p>
      </div>
    </footer>
  </body>
</html>
