name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repo.py
      - run: python .agents/skills/augustus/scripts/evaluate_decisions.py --self-test
      - run: python research/revisit_fingerprints.py --self-test
      - run: bash -n scripts/hourly-refresh.sh && bash -n scripts/refresh-jev-research.sh
