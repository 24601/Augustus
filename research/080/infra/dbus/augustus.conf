<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Augustus 0.8.0: the experiment principals may not ask system daemons to resolve names or
     move data off the host on their behalf. User policies override the services' default
     allow rules. -->
<busconfig>
  <policy user="augexp">
    <deny send_destination="org.freedesktop.resolve1"/>
    <deny send_destination="org.freedesktop.network1"/>
    <deny send_destination="org.freedesktop.NetworkManager"/>
    <deny send_destination="org.freedesktop.import1"/>
    <deny send_destination="org.freedesktop.machine1"/>
    <deny send_destination="org.freedesktop.portable1"/>
  </policy>
  <policy user="augctl">
    <deny send_destination="org.freedesktop.resolve1"/>
    <deny send_destination="org.freedesktop.network1"/>
    <deny send_destination="org.freedesktop.NetworkManager"/>
    <deny send_destination="org.freedesktop.import1"/>
    <deny send_destination="org.freedesktop.machine1"/>
    <deny send_destination="org.freedesktop.portable1"/>
  </policy>
</busconfig>
